services:
  postgres:
    image: postgres:16.10-alpine3.22
    environment:
      POSTGRES_USER: ciunac_sdd_test
      POSTGRES_PASSWORD: ciunac-sdd-test-only
      POSTGRES_DB: ciunac_sdd_test
    ports:
      - "127.0.0.1:16543:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciunac_sdd_test -d ciunac_sdd_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  mongo:
    image: mongo:8.0.15-noble
    ports:
      - "127.0.0.1:27028:27017"
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30
